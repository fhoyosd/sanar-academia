<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    
    <div class="mb-3 d-flex gap-2">
      <a routerLink="/admin/dashboard" class="btn btn-outline-secondary btn-sm">
        ← Volver al menu principal
      </a>
    </div>

    <div *ngIf="mensajeExito" class="alert alert-success">{{ mensajeExito }}</div>
    <div *ngIf="mensajeError" class="alert alert-danger">{{ mensajeError }}</div>

    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Nueva Categoría / División</h5>
      </div>
      <div class="card-body">
        <form (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label">Nombre de la Categoría</label>
            <input 
              type="text" 
              name="nombre" 
              [(ngModel)]="categoria.nombre" 
              class="form-control" 
              placeholder="Ej: Categoría 2012 / Sub-15" 
              required>
          </div>

          <div class="mb-3">
            <label class="form-label">Profesor / Entrenador Asignado</label>
            <select name="profesor_id" [(ngModel)]="categoria.profesor_id" class="form-select" required>
              <option value="" disabled selected>Seleccione un profesor...</option>
              <option *ngFor="let p of profesores" [value]="p.id">{{ p.nombre_completo }}</option>
            </select>
          </div>

          <hr>
          <div class="d-flex justify-content-end gap-2">
            <a routerLink="/admin/dashboard" class="btn btn-light border">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Categoría</button>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
