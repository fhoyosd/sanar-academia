<div class="row justify-content-center mt-4">
  <div class="col-md-8">
    
    <div class="mb-3">
      <a routerLink="/admin/jugadores" class="btn btn-outline-secondary btn-sm">
        ← Volver a Fichas de Jugadores
      </a>
    </div>

    <div *ngIf="mensajeExito" class="alert alert-success alert-dismissible fade show mb-3">
      {{ mensajeExito }}
    </div>
    <div *ngIf="mensajeError" class="alert alert-danger alert-dismissible fade show mb-3">
      {{ mensajeError }}
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Editar Jugador</h5>
      </div>
      <div class="card-body">
        <form (ngSubmit)="onSubmit()">
          
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Nombre Completo</label>
              <input 
                type="text" 
                name="nombre" 
                [(ngModel)]="jugador.nombre" 
                class="form-control" 
                required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha de Nacimiento</label>
              <input 
                type="date" 
                name="fecha_nacimiento" 
                [(ngModel)]="jugador.fecha_nacimiento" 
                class="form-control" 
                required>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">Estatura (m)</label>
              <input 
                type="number" 
                step="0.01" 
                name="estatura" 
                [(ngModel)]="jugador.estatura" 
                class="form-control" 
                placeholder="Ej: 1.70">
            </div>
            <div class="col-md-4">
              <label class="form-label">Peso (kg)</label>
              <input 
                type="number" 
                step="0.1" 
                name="peso" 
                [(ngModel)]="jugador.peso" 
                class="form-control" 
                placeholder="Ej: 65.5">
            </div>
            <div class="col-md-4">
              <label class="form-label">Posición</label>
              <select name="posicion" [(ngModel)]="jugador.posicion" class="form-select">
                <option value="" disabled>Seleccione posición...</option>
                <option value="Portero">Portero</option>
                <option value="Defensa">Defensa</option>
                <option value="Centrocampista">Centrocampista</option>
                <option value="Delantero">Delantero</option>
              </select>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Categoría</label>
              <select name="categoria_id" [(ngModel)]="jugador.categoria_id" class="form-select" required>
                <option value="" disabled>Seleccione categoría...</option>
                <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nombre }}</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Acudiente Asignado</label>
              <select name="acudiente_id" [(ngModel)]="jugador.acudiente_id" class="form-select" required>
                <option value="" disabled>Seleccione acudiente...</option>
                <option *ngFor="let acu of acudientes" [value]="acu.id">
                  {{ acu.nombre_completo || acu.nombre || acu.email }}
                </option>
              </select>
            </div>
          </div>

          <hr>
          <div class="d-flex justify-content-end gap-2">
            <a routerLink="/admin/jugadores" class="btn btn-light border">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
